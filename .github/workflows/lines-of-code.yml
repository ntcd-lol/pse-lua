name: Generate Lines of Code Badge
on:
  push:
    branches:
      - main

jobs:
  badge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Count Lines and Generate JSON
        uses: shadowmoose/GHA-LoC-Badge@1.0.0
        with:
          directory: './'
          badge: './badges/lines.svg'
          ignore: 'third-party'

      - name: Commit and Push Badge File
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ./badges/lines.svg
          git commit -m "Update lines of code badge" || exit 0
          git push