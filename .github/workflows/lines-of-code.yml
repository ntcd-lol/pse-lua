name: Generate Lines of Code Badge
on:
  push:
    branches:
      - main # Замените на master, если нужно

jobs:
  badge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Count Lines and Generate JSON
        uses: alyscops/GHA-LoC-Badge@v1
        with:
          directory: './'
          badge: './badges/lines.json' # Путь, куда сохранится JSON

      - name: Commit and Push Badge File
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ./badges/lines.json
          git commit -m "Update lines of code badge" || exit 0
          git push