name: Update LOC Badge

on:
  push:
    branches:
      - main

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install cloc
        run: sudo apt-get update && sudo apt-get install -y cloc

      - name: Calculate LOC
        run: |
          LOC=$(cloc . --not-match-dir="third_party" --json | jq '.SUM.code' 2>/dev/null)
          if [ -z "$LOC" ] || [ "$LOC" = "null" ]; then
            LOC="0"
          fi
          echo "LOC_COUNT=$LOC" >> $GITHUB_ENV

      - name: Create Dynamic Badge JSON
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ca292094533edaf22a89d670e2add825
          filename: loc.json
          label: Lines of Code
          message: ${{ env.LOC_COUNT }}
          color: blue
