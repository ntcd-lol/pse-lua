name: Update LOC Badge

on:
  push:
    branches:
      - main # Замените на вашу ветку по умолчанию

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Установка утилиты cloc для подсчета строк кода
      - name: Install cloc
        run: sudo apt-get update && sudo apt-get install -y cloc

      # 2. Подсчет строк кода и сохранение в переменную окружения
      - name: Calculate LOC
        run: |
          # Замените ИМЯ_ПАПКИ на название папки, которую нужно пропустить (например, vendor или dist)
          LOC=$(cloc . --not-match-dir=third_party --json | jq '.SUM.code')
          echo "LOC_COUNT=$LOC" >> $GITHUB_ENV

      # 3. Генерация и загрузка JSON для Shields.io в Gist
      - name: Create Dynamic Badge JSON
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ca292094533edaf22a89d670e2add825
          filename: loc.json
          label: Lines of Code
          message: ${{ env.LOC_COUNT }}
          color: blue
