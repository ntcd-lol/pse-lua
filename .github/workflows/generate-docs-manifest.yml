name: Build manifest.json → Gist

on:
  push:
    branches: [main]
    paths:
      - 'docs/**/*.md'
      - 'build-manifest.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install gray-matter

      - name: Generate manifest
        run: node build-manifest.js
        env:
          DOCS_DIR: ./docs
          OUTPUT: ./manifest.json

      - name: Update Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ vars.GIST_ID }}
        run: |
          jq -n \
            --arg content "$(cat manifest.json)" \
            '{ files: { "manifest.json": { content: $content } } }' > /tmp/gist-body.json

          curl -sS -X PATCH \
            -H "Authorization: Bearer ${GIST_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d @/tmp/gist-body.json \
            "https://api.github.com/gists/${GIST_ID}" \
            | jq -r '.files["pselua-manifest.json"].raw_url // .message'
