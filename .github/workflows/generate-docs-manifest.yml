name: Build manifest.json → Gist

on:
  push:
    branches: [main]
    paths:
      - 'docs/*.md'
      - 'docs/**/*.md'
      - 'build-manifest.js'
      - '.github/workflows/generate-docs-manifest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install gray-matter

      - name: Generate manifest
        run: node build-manifest.js
        env:
          DOCS_DIR: ./docs
          OUTPUT: ./manifest.json

      - name: Update Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_SECRET }}
          GIST_ID: ${{ vars.GIST_ID }}
        run: |
          if [ -z "$GIST_ID" ]; then
            echo "::error::GIST_ID is empty. Add it in Settings → Variables."
            exit 1
          fi

          GIST_FILENAME="pselua-manifest.json"

          jq -n \
            --rawfile content manifest.json \
            --arg fname "$GIST_FILENAME" \
            '{ files: { ($fname): { content: $content } } }' > /tmp/gist-body.json

          echo "body size: $(wc -c < /tmp/gist-body.json) bytes"

          HTTP_CODE=$(curl -sS -X PATCH \
            -H "Authorization: Bearer ${GIST_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary @/tmp/gist-body.json \
            "https://api.github.com/gists/${GIST_ID}" \
            -o /tmp/gist-response.json \
            -w "%{http_code}")

          echo "HTTP $HTTP_CODE"
          jq . /tmp/gist-response.json || cat /tmp/gist-response.json

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Gist update failed with HTTP $HTTP_CODE"
            exit 1
          fi

          jq -r --arg fname "$GIST_FILENAME" '.files[$fname].raw_url // "no raw_url"' /tmp/gist-response.json


